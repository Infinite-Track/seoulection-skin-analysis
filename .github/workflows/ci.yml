# push·PR마다 코드가 멀쩡한지 검사한다 (배포는 안 한다).
#   1) pyflakes: 문법 오류, 안 쓰는 import, 정의 안 된 이름
#   2) pytest: Kafka·모델 없이 돌아가는 단위 테스트 (Kafka는 가짜 객체, 모델은 MODEL_ENABLED=false)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libegl1 libgles2
          pip install -r requirements.txt -r requirements-dev.txt

      - name: pyflakes
        run: python -m pyflakes common serving scripts tests

      - name: pytest
        run: python -m pytest -q
