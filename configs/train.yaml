# 학습 설정 (training/train.py). 여기 없는 키는 TrainConfig 기본값(= skin v2 배포 학습 설정)을 쓴다.
# 우선순위: TrainConfig 기본값 < 이 파일 < CLI (--lr-head 1e-4 처럼). 키 이름은 training/config.py TrainConfig와 같다.

# 학습 데이터셋. dir 아래에 crops.csv, labels.csv, crops/ 가 있어야 한다 (형식: training/dataset.py 맨 위)
#   SageMaker에서는 채널 SM_CHANNEL_<NAME 대문자>가 있으면 dir 대신 그 경로를 쓴다
#   test_split에 적힌 person_id는 학습에서 빼고 평가(training/evaluate.py)에만 쓴다 (Phase 2 make_splits.py가 만든다)
datasets:
  - name: aihub_kr
    dir: outputs/datasets/aihub_kr
    test_split: configs/splits/aihub_kr_test.txt

# 파인튜닝 시작점 (체크포인트 model.pt 경로). 비우면 ImageNet 사전학습에서 처음부터 (= skin v2 재현).
#   CLI --init-from 또는 SageMaker 채널 SM_CHANNEL_BASE_MODEL이 있으면 그것을 쓴다
init_from: null

# 검증·조기 종료 (기본값): 학습 인물의 20%를 인물 단위로 떼어(val_fraction 0.2, seed 고정) 에폭마다 검증 점수를 재고,
#   patience(6)만큼 연속으로 좋아지지 않으면 멈춘 뒤 최고 에폭 가중치를 쓴다. epochs(15)는 상한이다.
#   skin v2 배포 학습 그대로(검증 없이 800명 전원, 6에폭 고정)를 재현하려면: val_fraction: 0, epochs: 6
# 그 밖의 값은 전부 skin v2와 같아 적지 않아도 된다. 바꿀 것만 적는다. 예:
# val_fraction: 0.2
# patience: 6
# epochs: 15
# lr_backbone: 2.0e-5
# lr_head: 2.0e-4
